site_name: Restic for Mere Mortals
site_description: Plain-language backups that are encrypted, deduplicated and checkable. Creating a repository and guarding its password, taking snapshots, proving deduplication with measured numbers, restoring and verifying files, forgetting old snapshots and pruning what they leave behind, and knowing exactly what a lost password costs.
site_url: https://paulsullivan33-dev.github.io/restic-for-mere-mortals/

